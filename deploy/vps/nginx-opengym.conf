# Host nginx do VPS -> container web do openGym (127.0.0.1:8090, só loopback).
# Instalado em /etc/nginx/sites-enabled/opengym. O certbot --nginx acrescenta o bloco 443
# no arquivo do VPS; este aqui é a versão antes do certificado.

# Só a Cloudflare chega neste vhost: assim o CF-Connecting-IP repassado não pode ser forjado
# por quem acessa o IP do VPS direto. Lista de https://www.cloudflare.com/ips (26/11/2026).
# ponytail: lista fixa; se a Cloudflare ganhar faixa nova, o visitante dela leva 444 até atualizar.
# $realip_remote_addr: o VPS tem conf.d/cloudflare-realip.conf ativo, que troca $remote_addr pelo
# IP do visitante; aqui interessa quem abriu a conexão.
geo $realip_remote_addr $opengym_via_cf {
    default 0;
    173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1;
    141.101.64.0/18 1; 108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1; 162.158.0.0/15 1; 104.16.0.0/13 1;
    104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1;
    2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name opengym.julianmagossi.com.br;

    if ($opengym_via_cf = 0) { return 444; }

    # Mesmo teto do /api do container (o histórico inteiro vai num PUT /api/data).
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Confiável só porque o geo acima garante que a conexão veio da Cloudflare.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    location / {
        proxy_pass http://127.0.0.1:8090;
        # Chamadas do Coach esperam o modelo (o container usa 300s).
        proxy_read_timeout 300s;
    }

    # Fotos e vídeos de exercício: o teto do container (MEDIA_UPLOAD_MAX) e sem gravar em disco
    # aqui, para a API recusar em fluxo, como o nginx do próprio container faz.
    location ^~ /api/media/ {
        client_max_body_size 112m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8090;
    }
}
